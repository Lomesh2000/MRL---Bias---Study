# =========================================================
# Central Configuration for MRL Bias Experiments
# =========================================================

data:
  corpus: "reddit_l2_small"       # use small subset for initial experiments
  max_sentences: 500000           # cap for quick iteration
  gender_pairs_file: "data/gender_pairs/gender_pairs.txt"
  weat_dir: "data/weat_wordlists/"

embeddings:
  dim: 300                        # full embedding dimension D
  mrl_dims: [8, 16, 32, 64, 128, 300]   # prefix dimensions d1 < d2 < ... < D
  window: 5
  min_count: 5
  epochs: 10
  seed: 42

bias_subspace:
  k: 10                           # number of top PCs for bias subspace B

debiasing:
  lambda_1: 1.0                   # semantic preservation weight
  lambda_2: 1.0                   # bias removal weight
  # RQ4: try adaptive lambda per prefix dim
  adaptive_lambda: false
  lambda_per_dim:                 # used if adaptive_lambda=true
    8:   2.0
    16:  1.8
    32:  1.5
    64:  1.2
    128: 1.0
    300: 1.0

results:
  save_dir: "results/"
  figures_dir: "results/figures/"
  bias_scores_dir: "results/bias_scores/"

models:
  With MRL: tomaarsen/mpnet-base-nli-matryoshka
  Without MRL: tomaarsen/mpnet-base-nli